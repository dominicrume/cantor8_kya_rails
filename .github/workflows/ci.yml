name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    # The important one. If Python and JavaScript ever disagree about a seal,
    # the receipt chain is broken across languages and the format is worthless.
    # This job is what makes a pull request from a stranger safe to merge.
    name: seal conformance (Python + JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }

      - name: Python implementation
        run: python3 tests/conformance.py

      - name: JavaScript implementation
        run: node tests/conformance.js

      - name: Go implementation
        run: cd impl/go && go run .

      - name: vectors are reproducible from the reference implementation
        run: |
          cp tests/vectors.json /tmp/vectors.committed.json
          python3 tests/make_vectors.py
          diff -u /tmp/vectors.committed.json tests/vectors.json \
            || { echo "::error::vectors.json does not match the reference implementation."; \
                 echo "Re-run tests/make_vectors.py and commit the result."; exit 1; }

      - name: MCP server - a model cannot overspend its mandate
        run: python3 tests/mcp_smoke.py

      - name: operator interface - the fences reach the screen
        run: python3 tests/operator_smoke.py

      - name: the Breet webhook confirms only what matches a held deal
        run: python3 tests/breet_smoke.py

      - name: the bot cannot be talked into a rate, an account or a shortcut
        run: python3 tests/bot_smoke.py

      - name: the privacy matrix matches the Daml
        run: python3 tests/privacy_matrix.py --check

      - name: every spending rule is present in its contract
        run: python3 tests/fence_lint.py

      - name: nothing unreachable after a return
        run: python3 tests/deadcode_lint.py

      - name: no function over the complexity ceiling without a written reason
        run: python3 tests/complexity_lint.py

      - name: bandit - production code must be clean
        run: |
          pip install --quiet bandit
          python3 tests/security_lint.py

      - name: no unescaped interpolation reaches the DOM
        run: python3 tests/xss_lint.py

      - name: the whole OTC cycle holds at every join
        run: python3 tests/cycle_smoke.py

      - name: the published package and the repository are the same format
        run: |
          python3 tests/package_smoke.py
          cd pkg && PYTHONPATH=src python3 -m knowyouragenticai_receipts

      - name: any implementation can be graded through a pipe
        run: python3 tests/conformance_any.py -- python3 impl/pipe/reference.py

      - name: anyone can check a file by dropping it on the page
        run: node tests/checker_smoke.js

      - name: the verifier answers the origin question on the page
        run: node tests/origin_smoke.js

      - name: the hosted page is regenerated, never hand-edited
        run: |
          python3 step-3-verify/build-standalone.py --pages
          git diff --exit-code docs/index.html

      - name: the handed-out standalone file is self-contained and current
        run: python3 tests/standalone_smoke.py

      - name: the agent anchors the chain it wrote, or says it did not
        run: python3 tests/anchor_smoke.py

      - name: nothing reaches the bot unless Meta sent it
        run: python3 tests/meta_smoke.py

      - name: the Meta webhook is actually wired into the server
        run: python3 tests/meta_wire_smoke.py

      - name: the Breet webhook is wired in and its allowlist survives a proxy
        run: python3 tests/breet_wire_smoke.py

      - name: the quote outlives the process, and its history is tamper-evident
        run: python3 tests/store_smoke.py

      - name: the whole desk runs from one file, in a directory that is not the repo
        run: python3 tests/bundle_smoke.py

      - name: the operating view shows the float, the refusals and their rules
        run: python3 tests/desk_view_smoke.py

      - name: no text on any page is invisible against its own background
        run: python3 tests/contrast_lint.py

      - name: every page is a document, readable on a phone, usable without a mouse
        run: python3 tests/a11y_lint.py

      - name: the desk refuses settings it cannot understand, and the ledger enforces them
        run: python3 tests/desk_config_smoke.py

      - name: killing the wallet loses no receipts, and buys the agent no cap
        run: python3 tests/mcp_survives_kill.py

      - name: every line the README shows a judge is still that line
        run: python3 tests/readme_citations.py

      - name: the float adds up, and every number the README shows is still true
        run: python3 tests/balance_lint.py

      - name: no malformed request can make the desk stop answering
        run: python3 tests/route_fuzz.py

      - name: an audit's findings cannot be softened after the fact
        run: python3 tests/assurance_smoke.py

      - name: the rules an agent ran under cannot be widened after the fact
        run: python3 tests/policy_smoke.py

      - name: the action is callable by a stranger and cannot quietly stop
        run: python3 tests/action_smoke.py

      - name: neither screen goes silent, or lies, when the desk stops answering
        run: node tests/frontend_offline.js

      - name: breaking a real thing makes a suite go red
        run: python3 tests/mutation_suite.py

      - name: every refusal at the edges is covered by a test
        run: python3 tests/mutation_py.py

      - name: the agent runs offline, stdlib only
        run: |
          python3 step-2-agent/agent.py
          python3 - <<'PY'
          import json
          raw = open("step-3-verify/receipts.js").read()
          rs = json.loads(raw[raw.index("["):raw.rindex("]") + 1])
          assert len(rs) == 6, "expected 6 receipts, got %d" % len(rs)
          assert sum(r["outcome"] == "REFUSED" for r in rs) == 4, "expected 4 refusals"
          assert all(r.get("ledger") for r in rs), "every receipt must name its ledger"
          bad = [r["n"] for r in rs if any(not str(v).isascii() for v in r.values())]
          assert not bad, "non-ASCII in sealed receipts: %s" % bad
          print("offline run: 6 receipts, 4 refusals, all labelled, all ASCII")
          PY

  # requires-python = ">=3.8" was an untested claim in published metadata.
  # This is what makes it a tested one. The package is stdlib-only, so there is
  # nothing to install and nothing to cache -- if it imports and self-tests on
  # a version, that version is supported.
  package-python-versions:
    name: knowyouragenticai-receipts on every Python it claims
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python-version }}' }
      - name: the package self-tests against the shipped vectors
        run: cd pkg && PYTHONPATH=src python3 -m knowyouragenticai_receipts
      - name: and its command-line verifier works
        run: |
          cd pkg
          PYTHONPATH=src python3 -m knowyouragenticai_receipts verify ../step-3-verify/receipts.js

  daml:
    # The fences themselves. Slower, and it needs the SDK, so it runs beside
    # conformance rather than gating it.
    name: daml attack suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: install Daml SDK
        run: |
          curl -sSL https://get.daml.com | sh -s 3.4.11
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"
      - name: build the mandate (deployed package, no test types in it)
        working-directory: step-1-mandate
        run: |
          daml build
          if daml damlc inspect-dar .daml/dist/kya-rails-mandate-*.dar | grep -q KyaTest; then
            echo "::error::test types leaked into the deployed DAR"; exit 1
          fi
      - name: every test is named after the attack it proves
        working-directory: step-1-mandate/test
        run: |
          # `daml test` exits 0 when it runs NOTHING. Run it in the package
          # next door -- where the templates live but no scripts do -- and it
          # reports success having tested not one thing. So the count is
          # asserted, not the exit code: if the scripts ever move, or the
          # working-directory line above is lost in an edit, this job goes red
          # instead of quietly certifying an empty suite.
          daml test --all --show-coverage 2>&1 | tee /tmp/daml-test.log
          ran=$(grep -c ': ok,' /tmp/daml-test.log || true)
          echo "$ran scripts ran"
          if [ "$ran" -lt 92 ]; then
            echo "::error::expected at least 92 attack scripts, $ran ran"; exit 1
          fi
          # 42 choices, 28 exercised; the other 14 are Daml's auto-generated
          # Archive on each template. The README says so, so it is checked.
          if ! grep -q '28 ( 66.7%) exercised in any tests' /tmp/daml-test.log; then
            echo "::error::choice coverage moved; the README claim needs re-checking"
            grep -A3 'External template choices' /tmp/daml-test.log; exit 1
          fi

  mutation:
    # The only job that tests the tests. Deletes each fence in the Daml in turn
    # and requires a named test to go red. A green suite that survives a
    # deleted fence is decoration, and this is how we find that out.
    name: mutation testing (every fence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: install Daml SDK
        run: |
          curl -sSL https://get.daml.com | sh -s 3.4.11
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"
      - name: deleting any fence must turn a test red
        run: python3 tests/mutation.py
