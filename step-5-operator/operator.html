<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Operator &middot; KYA Rails</title>
<style>
  :root{
    --bg:#0f1613; --card:#18211d; --line:#28332e; --ink:#eaf0ec; --dim:#93a29a;
    --ok:#2f9e5e; --okbg:#122b1e; --no:#c8853a; --nobg:#2b2113;
    --stop:#c0392b; --gold:#c8b458;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       padding:0 0 40px;line-height:1.45}
  .wrap{max-width:460px;margin:0 auto;padding:0 16px}
  header{padding:18px 0 12px;display:flex;align-items:baseline;gap:8px}
  header h1{font-size:17px;letter-spacing:.2px}
  header span{font-size:11px;color:var(--dim)}

  /* The mandate, always visible. Most refusals should never happen because
     the operator can see the limit before they ask. */
  .mandate{background:var(--card);border:1px solid var(--line);border-radius:14px;
           padding:16px;margin-bottom:14px}
  .float{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .float b{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .float small{font-size:13px;color:var(--dim)}
  .bar{height:6px;background:#0b120f;border-radius:3px;overflow:hidden;margin:10px 0 12px}
  .bar i{display:block;height:100%;background:var(--ok);transition:width .4s ease}
  .facts{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;color:var(--dim);background:#0d1512;border:1px solid var(--line);
        border-radius:999px;padding:4px 10px}

  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px}
  select,input,textarea{width:100%;background:#0d1512;color:var(--ink);
       border:1px solid var(--line);border-radius:10px;padding:13px 12px;font-size:16px;
       font-family:inherit}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
  .hint{font-size:11px;color:var(--dim);margin-top:6px}
  button{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;
         font-weight:600;font-family:inherit;cursor:pointer;margin-top:16px}
  #send{background:var(--ok);color:#fff}
  #send:disabled{background:#26362e;color:#6d7d75}

  /* The answer. This is the screen that matters: a refusal must read as the
     system deciding, not as the operator failing. */
  .answer{border-radius:14px;padding:16px;margin:14px 0;border:1px solid var(--line);
          display:none}
  .answer.show{display:block}
  .answer.yes{background:var(--okbg);border-color:#1e5c3a}
  .answer.no{background:var(--nobg);border-color:#6b4a1c}
  .answer h2{font-size:16px;margin-bottom:6px}
  .answer .rule{font-size:13px;color:var(--ink);opacity:.85}
  .answer .who{font-size:11.5px;color:var(--dim);margin-top:10px}
  .seal{font-family:var(--mono);font-size:10px;color:var(--dim);word-break:break-all;
        margin-top:8px}

  h3{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
     margin:22px 0 8px;font-weight:600}
  .r{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ok);
     border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
  .r.no{border-left-color:var(--no)}
  .r b{font-variant-numeric:tabular-nums}
  .r .rule{font-size:11.5px;color:var(--dim);margin-top:3px}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .ledger{text-align:center;font-size:11px;color:var(--gold);padding:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Operator</h1><span id="who"></span></header>

  <div class="mandate">
    <div class="float"><b id="remaining">—</b><small id="capline"></small></div>
    <div class="bar"><i id="barfill" style="width:0%"></i></div>
    <div class="facts" id="facts"></div>
  </div>

  <div class="answer" id="answer">
    <h2 id="ansTitle"></h2>
    <div class="rule" id="ansRule"></div>
    <div class="who" id="ansWho"></div>
    <div class="seal" id="ansSeal"></div>
  </div>

  <label for="payee">Pay</label>
  <select id="payee"></select>
  <div class="hint">Only accounts the principal authorised appear here. A new
    account has to be added by them, not typed in here.</div>

  <label for="amount">Amount</label>
  <input id="amount" type="number" inputmode="decimal" step="0.1" min="0.1" placeholder="0.0">

  <label for="what">What is this for</label>
  <input id="what" type="text" placeholder="e.g. trade 1193, customer leg">

  <button id="send" disabled>Request payout</button>

  <h3>Today's attempts</h3>
  <div id="list"><div class="empty">Nothing yet.</div></div>

  <div class="ledger" id="ledger"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let STATE = null;

const money = n => Number(n).toFixed(1) + ' CC';

function render(s){
  STATE = s;
  $('remaining').textContent = money(s.remaining);
  $('capline').textContent = 'left of ' + money(s.cap);
  $('barfill').style.width = (s.cap ? (s.remaining / s.cap * 100) : 0) + '%';

  const facts = ['You may pay ' + s.recipients.length + ' authorised accounts'];
  if (s.period_limit) facts.push('Max ' + money(s.period_limit) + ' per window');
  facts.push('Principal can stop this at any moment');
  $('facts').innerHTML = facts.map(f => '<span class="chip">' + f + '</span>').join('');

  if (!$('payee').options.length){
    $('payee').innerHTML = s.recipients
      .map(r => '<option value="' + r.key + '">' + r.name + '</option>').join('');
  }
  $('ledger').textContent = s.ledger;
  $('who').textContent = s.open ? 'mandate active' : 'no mandate';

  const list = $('list');
  if (!s.receipts.length){ list.innerHTML = '<div class="empty">Nothing yet.</div>'; }
  else {
    list.innerHTML = s.receipts.slice().reverse().map(r =>
      '<div class="r' + (r.outcome === 'REFUSED' ? ' no' : '') + '">' +
      '<b>' + r.amount + ' ' + r.currency + '</b> &rarr; ' + esc(r.payee) +
      '<div class="rule">' + (r.outcome === 'REFUSED' ? 'refused &middot; ' : 'paid &middot; ') +
      esc(r.rule) + '</div></div>').join('');
  }
  $('send').disabled = !s.open;
}

const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function refresh(){ render(await (await fetch('/api/state')).json()); }

$('send').onclick = async () => {
  const amount = parseFloat($('amount').value);
  if (!(amount > 0)) { $('amount').focus(); return; }
  $('send').disabled = true; $('send').textContent = 'Asking the ledger…';
  const res = await (await fetch('/api/request', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({amount, payee: $('payee').value, what: $('what').value || 'payout'})
  })).json();
  $('send').textContent = 'Request payout';

  const box = $('answer');
  box.className = 'answer show ' + (res.outcome === 'ACCEPTED' ? 'yes' : 'no');
  if (res.error){
    box.className = 'answer show no';
    $('ansTitle').textContent = 'Not sent';
    $('ansRule').textContent = res.error;
    $('ansWho').textContent = ''; $('ansSeal').textContent = '';
  } else if (res.outcome === 'ACCEPTED'){
    $('ansTitle').textContent = 'Paid — ' + money(amount);
    $('ansRule').textContent = res.rule;
    $('ansWho').textContent = 'Receipt #' + res.receipt.n +
      ' sealed. The principal can verify this without asking you.';
    $('ansSeal').textContent = 'seal ' + res.receipt.seal.slice(0, 40) + '…';
  } else {
    // The wording here is deliberate. The operator did nothing wrong.
    $('ansTitle').textContent = 'The ledger refused this';
    $('ansRule').textContent = res.rule;
    $('ansWho').textContent = 'Not your decision to make or to override — and ' +
      'the refusal is on record, so nobody can say you were asked and ignored it.';
    $('ansSeal').textContent = 'seal ' + res.receipt.seal.slice(0, 40) + '…';
  }
  $('amount').value = ''; $('what').value = '';
  await refresh();
};

refresh();
</script>
</body>
</html>
